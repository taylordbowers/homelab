site_name: Taylor's Homelab
site_description: A Proxmox homelab running media, cloud, gaming, AI-assisted operations, and self-hosted services.
site_url: https://taylordbowers.github.io/homelab
repo_url: https://github.com/taylordbowers/homelab
repo_name: taylordbowers/homelab
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - def_list

nav:
  - Home: index.md
  - Hardware:
    - Overview: hardware/index.md
    - pve (Primary Node): hardware/pve.md
    - pve-guide (Storage Node): hardware/pve-guide.md
    - Windows 11 VM: hardware/win11-vm.md
  - Infrastructure:
    - Storage: infrastructure/storage.md
    - Backups: infrastructure/backups.md
    - Network: infrastructure/network.md
    - GPU Passthrough: infrastructure/gpu-passthrough.md
    - Power & Resilience: infrastructure/power.md
  - Services:
    - Media:
      - Jellyfin: services/media/jellyfin.md
      - The *arr Stack: services/media/arr-stack.md
      - Immich: services/media/immich.md
    - Cloud:
      - Nextcloud AIO: services/cloud/nextcloud.md
    - Network:
      - AdGuard Home: services/network/adguard.md
      - Nginx Proxy Manager: services/network/nginx-proxy-manager.md
      - Cloudflare DDNS: services/network/cloudflare-ddns.md
      - Tailscale: services/network/tailscale.md
      - Restreamer: services/network/restreamer.md
    - Management:
      - Proxmox: services/management/proxmox.md
      - Portainer: services/management/portainer.md
      - Homarr: services/management/homarr.md
      - Uptime Kuma: services/management/uptime-kuma.md
      - Filebrowser: services/management/filebrowser.md
      - Apache Guacamole: services/management/guacamole.md
    - Gaming:
      - Crafty Controller: services/gaming/crafty.md
      - AMP Game Server: services/gaming/amp.md
    - AI & Automation:
      - Claude Code Agent: services/automation/claude-agent.md
      - Self-Healing: services/automation/self-healing.md
      - Byte (Discord Agent): services/automation/discord-bot.md
      - Jarvis HUD: services/automation/jarvis-hud.md
      - Trading Bots: services/automation/trading-bot.md
